name: Waste Robot UI and Safety Checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [design/eco-final-20261117]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test robot operator behavior
        run: npm test
      - name: Build and type check
        run: npm run build
